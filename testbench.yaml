laravel: '@testbench'

env:
  CACHE_STORE: file

providers:
  # - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

purge:
  files:
    - database/migrations/*_create_linkado_*_table.php

workbench:
  start: '/'
  install: true
  health: false
  discovers:
    web: true
    api: true
    commands: true
    components: false
    factories: true
    views: false
  build:
    - asset-publish
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
    - schedule-list
  assets:
    - laravel-assets
    - linkado-migrations
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
